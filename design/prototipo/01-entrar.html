  </div>
  <div class="rodape-entrada">
    <a class="btn primario" href="03-cartoes.html" data-v-nao="entrando">Entrar com Google</a>
    <span class="btn primario" data-v="entrando" aria-disabled="true"><svg class="ic girar"><use href="#i-sincronizando"/></svg>Entrando…</span>
