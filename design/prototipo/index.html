<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Meu Território</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  body { padding: 28px 20px 60px; }
  .hub { max-width: 1240px; margin: 0 auto; }
  .hub-topo { display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
  .hub h1 { font-size: 30px; }
  .hub-topo p { color: var(--texto-suave); max-width: 60ch; margin-top: 6px; }
  .botoes-hub { display: flex; gap: 10px; flex-wrap: wrap; }
  .botoes-hub .btn { width: auto; min-height: 48px; font-size: 16px; }
  .grade-hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 24px 20px; }
  .tela-card { display: block; }
  .tela-card .moldura { position: relative; width: 195px; height: 422px; border-radius: 20px; overflow: hidden; border: 1.5px solid var(--borda); background: var(--cor-fundo); margin-bottom: 10px; }
  .tela-card iframe { width: 390px; height: 844px; border: 0; transform: scale(.5); transform-origin: 0 0; pointer-events: none; }
  .tela-card b { display: block; font-size: 18px; }
  .tela-card span { color: var(--texto-suave); }
  .tela-card:focus-visible .moldura, .tela-card:hover .moldura { border-color: var(--cor-principal); border-width: 3px; }
</style>
<script src="js/app.js"></script>
</head>
<body data-tela="Índice">
<div class="hub">
  <div class="hub-topo">
    <div>
      <h1>Meu Território · protótipo</h1>
      <p>10 telas e a página de componentes, em 390px, claro e escuro. Direção da Quadra: barra fixa na base. Cada tela tem estados (vazio, carregando, sem internet, erro) no painel à esquerda quando aberta em tela larga, ou por <code>?v=nome</code> no endereço.</p>
    </div>
    <div class="botoes-hub">
      <button class="btn primario" type="button" id="tema-hub">Ver no modo escuro</button>
      <a class="btn secundario" href="componentes.html">Componentes</a>
    </div>
  </div>

  <div class="grade-hub" id="grade"></div>
</div>

<script>
  var telas = [
    ['01-entrar.html', '1 · Entrar', 'Logo e botão do Google'],
    ['02-aguardando.html', '2 · Aguardando liberação', 'E-mail ainda não liberado'],
    ['03-cartoes.html', '3 · Cartões', 'Em andamento e fechados'],
    ['04-cartao.html', '4 · Cartão', 'Mapa e quadras'],
    ['05-quadra.html', '5 · Quadra', 'Casas e registro com um toque'],
    ['06-nova-casa.html', '6 · Nova casa', 'Uma casa ou faixa'],
    ['07-reordenar.html', '7 · Reordenar', 'Alça e setas'],
    ['08-casa.html', '8 · Casa', 'Status, observação e histórico'],
    ['09-admin.html', '9 · Admin', 'Membros, cartões e ciclo'],
    ['11-historico.html', 'Admin · Histórico', 'Últimas 10 aberturas e fechamentos'],
    ['10-instalar.html', '10 · Instalar o app', 'iPhone e Android'],
    ['componentes.html', 'Componentes', 'Botões, linhas, chips, avisos']
  ];
  var grade = document.getElementById('grade');
  function desenhar() {
    var escuro = document.documentElement.getAttribute('data-tema') === 'escuro';
    grade.innerHTML = telas.map(function (t) {
      return '<a class="tela-card" href="' + t[0] + '"><div class="moldura"><iframe src="' + t[0] + '?tema=' + (escuro ? 'escuro' : 'claro') + '" title="' + t[1] + '" tabindex="-1" loading="lazy"></iframe></div><b>' + t[1] + '</b><span>' + t[2] + '</span></a>';
    }).join('');
    document.getElementById('tema-hub').textContent = escuro ? 'Ver no modo claro' : 'Ver no modo escuro';
  }
  document.getElementById('tema-hub').addEventListener('click', function () {
    var escuro = document.documentElement.getAttribute('data-tema') === 'escuro';
    if (escuro) document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', 'escuro');
    try { localStorage.setItem('mt-tema', escuro ? 'claro' : 'escuro'); } catch (e) {}
    desenhar();
  });
  desenhar();
</script>
</body>
</html>
